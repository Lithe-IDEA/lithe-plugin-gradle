name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest version plugin.json accepts, and a current one.
        gradle: ["7.6", "9.6.1"]
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Verify vendored Java SDK sources
        run: node scripts/sdk/verify-sdk.mjs
      - name: Check manifest and build the archive
        run: node scripts/package.mjs
      - name: Test the settings backend
        run: node scripts/test-backend.mjs
      - name: Download Gradle ${{ matrix.gradle }}
        env:
          VERSION: ${{ matrix.gradle }}
        run: |
          base="https://services.gradle.org/distributions/gradle-$VERSION-bin.zip"
          curl -fsSLo "$RUNNER_TEMP/gradle.zip" "$base"
          echo "$(curl -fsSL "$base.sha256")  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "GRADLE=$RUNNER_TEMP/gradle-$VERSION/bin/gradle" >> "$GITHUB_ENV"
      - name: Run the declared commands with Gradle
        run: node scripts/test.mjs
      - name: Verify native compiler targets and local JARs
        run: |
          node --test --test-timeout=15000 scripts/compiler/process.test.mjs
          node scripts/compiler/test.mjs
      - name: Upload native compiler projections
        if: matrix.os == 'ubuntu-latest' && matrix.gradle == '9.6.1'
        uses: actions/upload-artifact@v4
        with:
          name: native-compiler-projection
          path: .artifacts/compiler/visual-*.json
          if-no-files-found: error
      - name: Verify Linux release archives
        run: node --test --test-timeout=60000 scripts/package/*.test.mjs
      - name: Validate against Lithe Store rules
        if: matrix.gradle == '9.6.1'
        run: |
          git clone --depth 1 https://github.com/Lithe-IDEA/Lithe-store "$RUNNER_TEMP/store"
          node --input-type=module -e "
            import { readPackageManifests, checkManifest } from '$RUNNER_TEMP/store/scripts/validate-index.mjs';
            import { readdirSync, readFileSync } from 'node:fs';
            const manifest = JSON.parse(readFileSync('io.github.lithe-idea.gradle-build/plugin.json', 'utf8'));
            const entry = { id: manifest.id };
            let failed = false;
            for (const name of readdirSync('dist').filter((name) => name.endsWith('.zip'))) {
              const { manifests, unsafe } = readPackageManifests('dist/' + name, entry.id);
              const problems = [...unsafe, ...checkManifest(manifests, entry, manifest)];
              for (const problem of problems) { console.error(name + ': ' + problem); failed = true; }
            }
            process.exit(failed ? 1 : 0);
          "

  native-settings-visual:
    name: Native compiler settings screenshots
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-compiler-projection
          path: .artifacts/compiler
      - name: Read pinned host revision
        id: host
        run: echo "revision=$(node -p 'JSON.parse(require("fs").readFileSync("compiler-host.json")).revision')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: 1lck/Lithe-IDEA
          ref: ${{ steps.host.outputs.revision }}
          path: .artifacts/host
      - uses: actions/setup-go@v5
        with:
          go-version-file: .artifacts/host/desktop/go.mod
          cache: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render actual compiler projections through the native host
        run: node scripts/compiler/visual.mjs .artifacts/host
      - uses: actions/upload-artifact@v4
        with:
          name: native-compiler-settings-screenshots
          path: .artifacts/compiler/visual/
          if-no-files-found: error
          retention-days: 14
