name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest version plugin.json accepts, and a current one.
        gradle: ["7.6", "9.6.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Check manifest and build the archive
        run: node scripts/package.mjs
      - name: Download Gradle ${{ matrix.gradle }}
        env:
          VERSION: ${{ matrix.gradle }}
        run: |
          base="https://services.gradle.org/distributions/gradle-$VERSION-bin.zip"
          curl -fsSLo "$RUNNER_TEMP/gradle.zip" "$base"
          echo "$(curl -fsSL "$base.sha256")  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "GRADLE=$RUNNER_TEMP/gradle-$VERSION/bin/gradle" >> "$GITHUB_ENV"
      - name: Run the declared commands with Gradle
        run: node scripts/test.mjs
      - name: Validate against Lithe Store rules
        if: matrix.gradle == '9.6.1'
        run: |
          git clone --depth 1 https://github.com/Lithe-IDEA/Lithe-store "$RUNNER_TEMP/store"
          node --input-type=module -e "
            import { readPackageManifests, checkManifest } from '$RUNNER_TEMP/store/scripts/validate-index.mjs';
            import { readdirSync, readFileSync } from 'node:fs';
            const manifest = JSON.parse(readFileSync('io.github.lithe-idea.gradle-build/plugin.json', 'utf8'));
            const entry = { id: manifest.id };
            let failed = false;
            for (const name of readdirSync('dist').filter((name) => name.endsWith('.zip'))) {
              const { manifests, unsafe } = readPackageManifests('dist/' + name, entry.id);
              const problems = [...unsafe, ...checkManifest(manifests, entry, manifest)];
              for (const problem of problems) { console.error(name + ': ' + problem); failed = true; }
            }
            process.exit(failed ? 1 : 0);
          "
