name: Release

# Push a tag v<version> matching plugin.json to publish a GitHub Release.
# Contract 0 requires the matching Viva preview. Upload a draft prerelease;
# the maintainer verifies downloaded assets before publishing it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRADLE_VERSION: 9.6.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build the archive
        run: |
          set -euo pipefail
          test -s "docs/releases/$GITHUB_REF_NAME.md"
          node scripts/package.mjs --expect-tag "$GITHUB_REF_NAME" | tee "$RUNNER_TEMP/checksums.txt"
      - name: Verify the settings backend
        run: node scripts/test-backend.mjs
      - name: Download Gradle
        run: |
          base="https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          curl -fsSLo "$RUNNER_TEMP/gradle.zip" "$base"
          echo "$(curl -fsSL "$base.sha256")  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "GRADLE=$RUNNER_TEMP/gradle-$GRADLE_VERSION/bin/gradle" >> "$GITHUB_ENV"
      - name: Run the declared commands with Gradle
        run: node scripts/test.mjs
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "为 Viva preview 提供 Gradle 项目、任务分组、JavaExec 应用运行、筛选测试、编译诊断与依赖树。"
            echo
            cat "docs/releases/$GITHUB_REF_NAME.md"
            echo
            echo "要求 Gradle 7.6+（项目 Wrapper、GRADLE_HOME 或 PATH）及该 Gradle 版本支持的 Java。插件不附带 Gradle。"
            echo
            echo "安装：下载本页对应系统的 ZIP，在兼容 Viva 预览客户端的插件设置中从文件安装。"
            echo
            echo "SHA-256："
            echo '```'
            sed 's#^dist/##' "$RUNNER_TEMP/checksums.txt"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          # Contract 0 currently requires the Viva preview host. A stable host
          # compatibility review must precede changing this publishing policy.
          release_flags=(--draft --prerelease)
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Gradle $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" "${release_flags[@]}"
