name: Release

# Push a tag v<version> matching plugin.json to publish a GitHub Release.
# v0.1.0 is a trial release for the preview buildSystems API; publish it as a
# pre-release immediately. Store listing needs a separate index pull request;
# its stable-release tracker does not automatically list this pre-release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRADLE_VERSION: 9.6.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build the archive
        run: node scripts/package.mjs --expect-tag "$GITHUB_REF_NAME" | tee "$RUNNER_TEMP/checksums.txt"
      - name: Download Gradle
        run: |
          base="https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          curl -fsSLo "$RUNNER_TEMP/gradle.zip" "$base"
          echo "$(curl -fsSL "$base.sha256")  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "GRADLE=$RUNNER_TEMP/gradle-$GRADLE_VERSION/bin/gradle" >> "$GITHUB_ENV"
      - name: Run the declared commands with Gradle
        run: node scripts/test.mjs
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "为 Lithe 提供 Gradle 项目、任务分组、JavaExec 应用运行、筛选测试、编译诊断与依赖树。"
            echo
            if [[ "$GITHUB_REF_NAME" == "v0.1.0" ]]; then
              echo "试用版：需要兼容 buildSystems 插件 API 3 的 Lithe preview 开发版；工具窗口由 macOS 宿主原生绘制。"
              echo
            fi
            echo "要求 Gradle 7.6+（项目 Wrapper、GRADLE_HOME 或 PATH）及该 Gradle 版本支持的 Java。插件不附带 Gradle。"
            echo
            echo "安装：Lithe Store 收录后可在插件市场搜索 Gradle；也可在 Lithe 开发版中从磁盘安装本页 ZIP。"
            echo
            echo "SHA-256："
            echo '```'
            sed 's#^dist/##' "$RUNNER_TEMP/checksums.txt"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == "v0.1.0" ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Gradle $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" "${release_flags[@]}"
